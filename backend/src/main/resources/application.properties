server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=tripcraft
server.error.include-message=never
spring.web.resources.static-locations=file:./dist/,file:../dist/,classpath:/static/
tripcraft.data-dir=${DATA_DIR:.data}
tripcraft.session-secret=${SESSION_SECRET:}
tripcraft.cookie-secure=${COOKIE_SECURE:false}
tripcraft.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
tripcraft.serp-key=${SERPAPI_API_KEY:}
tripcraft.serp-url=${SERPAPI_BASE_URL:https://serpapi.com/search.json}
tripcraft.weather-url=${WEATHER_BASE_URL:https://api.open-meteo.com/v1/forecast}
tripcraft.groq-key=${GROQ_API_KEY:}
tripcraft.groq-model=${GROQ_MODEL:openai/gpt-oss-120b}
tripcraft.groq-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
spring.jackson.deserialization.fail-on-unknown-properties=false

tripcraft.weather-key=${WEATHER_API_KEY:}
